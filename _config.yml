title: "KangMin Kim · Portfolio"
tagline: "Build, learn, improve."
description: "문제를 구조화하고 끝까지 구현하는 개발자 김강민의 포트폴리오"
url: "https://77romin.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

author:
  name: KangMin Kim
  email: 77romin@gmail.com
  github: 77romin

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
highlighter: rouge
sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - tools
  - _tabs
  - _plugins
  - vendor
