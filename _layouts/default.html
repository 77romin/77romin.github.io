<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website"><meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:image" content="{{ '/assets/img/77romin_avatar_green_ver.png' | absolute_url }}"><meta property="og:url" content="{{ page.url | absolute_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}"><link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}" sizes="any"><link rel="apple-touch-icon" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}"><link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>{% include header.html %}
    <main id="main-content">{{ content }}</main>{% include footer.html %}
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}" defer></script>
  </body>
</html>
