<footer class="site-footer">

    <div class="footer-links">
      <a href="mailto:{{ site.author.email }}" aria-label="Gmail로 이메일 보내기">{% include icon-gmail.html %}<span class="sr-only">Email</span></a>

    </div>
  </div>
