{% assign project = include.project %}
<article class="project-card reveal">
  <a class="project-visual visual-{{ project.accent | default: 'lime' }}" href="{{ project.url | relative_url }}" aria-label="{{ project.title }} 자세히 보기">
    <span class="project-index">0{{ include.index }}</span><span class="project-monogram" aria-hidden="true">{{ project.monogram }}</span><span class="project-kind">{{ project.kind }}</span>
  </a>
  <div class="project-card-body">
    <div class="project-card-heading">
      <div><p class="project-meta">{{ project.period }} · {{ project.role }}</p><h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3></div>
      <a class="round-link" href="{{ project.url | relative_url }}" aria-label="{{ project.title }} 상세 페이지">↗</a>
    </div>
    <p>{{ project.summary }}</p>
    <ul class="tag-list" aria-label="사용 기술">{% for tech in project.stack limit: 5 %}<li>{{ tech }}</li>{% endfor %}</ul>
  </div>
</article>
